<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) so react-native-safe-area-context
         can keep content off the notch / home indicator. No maximum-scale / user-scalable=no. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Installed web app (PWA) shell. theme-color is injected by Expo from app.json `web.themeColor`. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="sharedShelf" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews (iMessage, Slack, WhatsApp...). Crawlers don't run JS, so every
         route shares these. og:image must be absolute. Card source: assets/og-image.html -->
    <meta name="description" content="Your friends’ shelves, one tap away." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sharedShelf" />
    <meta property="og:title" content="sharedShelf" />
    <meta property="og:description" content="Your friends’ shelves, one tap away." />
    <meta property="og:url" content="https://shared-shelf-henna.vercel.app/" />
    <meta property="og:image" content="https://shared-shelf-henna.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="sharedShelf: three books on a shelf" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="pwa-shell">
      html,
      body {
        /* Matches colors.background in lib/theme.ts */
        background-color: #f5f7fa;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
